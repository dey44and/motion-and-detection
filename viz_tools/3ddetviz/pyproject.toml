[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detviz"
version = "0.2.0"
description = "Desktop review of autonomous driving detections and ground truth"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "visual-utils>=0.3,<0.4",
    "threedviz>=0.3,<0.4",
    "numpy>=1.24,<3",
    "ijson>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
3ddetviz = "detviz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../3dviz/src", "../../visual_utils/src"]
