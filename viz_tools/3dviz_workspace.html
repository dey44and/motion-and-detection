<div id="draft-3dviz" aria-label="3dviz browser workspace draft">
  <header class="dv-header">
    <div class="dv-brand"><i data-lucide="box" aria-hidden="true"></i><strong>3dviz</strong></div>
    <div class="dv-source-fields">
      <label>Dataset <select data-dataset><option value="nuscenes">nuScenes</option><option value="waymo">Waymo</option></select></label>
      <label>Split <select data-split><option value="val">Validation</option><option value="train">Train</option></select></label>
      <label>Scene <select data-scene></select></label>
    </div>
  </header>
  <div class="dv-workspace">
    <section class="dv-view" aria-label="Point cloud viewport">
      <canvas aria-label="Illustrative LiDAR point cloud with ground truth and prediction boxes" role="img"></canvas>
      <div class="dv-view-top">
        <div class="dv-view-caption"><b data-sensor>LIDAR_TOP</b><span>Illustrative data</span></div>
        <div class="dv-camera" role="group" aria-label="Camera perspective">
          <button type="button" data-camera="orbit" aria-pressed="true">Orbit</button>
          <button type="button" data-camera="top" aria-pressed="false">Top</button>
        </div>
      </div>
      <div class="dv-view-bottom">
        <div class="dv-box-key" aria-label="Box line styles">
          <span data-gt-key><i></i>GT boxes</span><span data-pred-key><i></i>Predicted boxes</span>
        </div>
        <span class="dv-view-meters" data-camera-label>LiDAR reference · m</span>
      </div>
    </section>
    <aside class="dv-inspector" aria-label="Inspector">
      <div class="dv-layers" role="group" aria-label="Visible layers">
        <div class="dv-kicker">Layers</div>
        <label><input data-cloud type="checkbox" checked> Point cloud</label>
        <label><input data-gt-boxes type="checkbox" checked> Ground truth boxes</label>
        <label><input data-pred-boxes type="checkbox" checked> Predicted boxes</label>
      </div>
      <div class="dv-inspector-body">
        <div class="dv-tabs" role="group" aria-label="Inspector sections">
          <button type="button" data-tab="scene" aria-controls="dv-panel-scene" aria-pressed="false">Scene</button>
          <button type="button" data-tab="detection" aria-controls="dv-panel-detection" aria-pressed="false">Detection</button>
          <button type="button" data-tab="seg" aria-controls="dv-panel-seg" aria-pressed="true">LiDAR seg</button>
        </div>
        <section id="dv-panel-scene" data-panel="scene" hidden>
          <label class="dv-field">Color points by
            <select data-color><option value="distance">Distance</option><option value="rgb">Camera RGB</option><option value="semantic">Semantic class</option></select>
          </label>
          <label class="dv-field">Point size <input data-size type="range" min="1" max="3" step="0.25" value="1.5"></label>
          <button type="button" data-reset>Reset camera</button>
        </section>
        <section id="dv-panel-detection" data-panel="detection" hidden>
          <div class="dv-field"><span>Prediction run</span><b>Demo detector</b><span class="dv-secondary">Pre-NMS export</span></div>
          <label class="dv-field"><span class="dv-spread">Minimum confidence <output data-confidence-value>0.10</output></span><input data-confidence type="range" min="0" max="1" step="0.01" value="0.1"></label>
          <div class="dv-secondary" data-detection-status aria-live="polite"></div>
        </section>
        <section id="dv-panel-seg" data-panel="seg">
          <div class="dv-field" data-seg-controls>
            <span>Point labels</span>
            <div class="dv-seg-source" role="group" aria-label="Point label source">
              <button type="button" data-labels="gt" aria-pressed="true">Ground truth</button>
              <button type="button" data-labels="pred" aria-pressed="false">Prediction</button>
            </div>
            <label class="dv-field" data-run-field hidden>Prediction run
              <select data-run><option value="a">Linear probe</option><option value="b">Fine-tuned model</option></select>
            </label>
            <div class="dv-secondary" data-taxonomy>nuScenes evaluation classes</div>
          </div>
          <div class="dv-class-list" data-classes role="group" aria-label="Visible semantic classes"></div>
          <div class="dv-secondary" data-seg-status aria-live="polite"></div>
        </section>
      </div>
    </aside>
  </div>
  <footer class="dv-timeline">
    <div class="dv-step" role="group" aria-label="Frame controls">
      <button type="button" data-step="-1" aria-label="Previous frame"><span aria-hidden="true">‹</span></button>
      <button type="button" data-step="1" aria-label="Next frame"><span aria-hidden="true">›</span></button>
    </div>
    <label class="dv-frame-field">Frame <input type="number" data-frame-jump min="1" max="40" value="12" aria-label="Frame number"> <span data-total>/ 40</span></label>
    <input type="range" data-frame min="1" max="40" value="12" aria-label="Scrub frames">
  </footer>
</div>

<style>
  #draft-3dviz {
    color-scheme: light dark;
    --shell: light-dark(#fcfcfd, #1e2328);
    --panel: light-dark(#f5f7f8, #242a30);
    --field: light-dark(#fff, #2b3239);
    --text: light-dark(#20282f, #edf0f3);
    --secondary: light-dark(#52606b, #b3bfc8);
    --line: light-dark(#d9dfe4, #3d474f);
    --active: light-dark(#e6edf3, #354652);
    --accent: light-dark(#2a536d, #9cc8e3);
    --brand: light-dark(#9d590e, #f8ac52);
    --viewport: #101820;
    --box-gt: #97e9c3;
    --box-pred: #ffb26d;
    --inspector-width: 258px;
    box-sizing: border-box;
    width: 100%;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--shell);
    color: var(--text);
    font: 13px/1.45 Inter, system-ui, sans-serif;
  }
  #draft-3dviz *, #draft-3dviz *::before, #draft-3dviz *::after { box-sizing: border-box; }
  #draft-3dviz [hidden] { display: none !important; }
  #draft-3dviz button, #draft-3dviz input, #draft-3dviz select { font: inherit; color: inherit; }
  #draft-3dviz button, #draft-3dviz select, #draft-3dviz input[type=number] {
    min-height: 32px;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 3px 8px;
    background: var(--field);
  }
  #draft-3dviz button:disabled { opacity: .45; }
  #draft-3dviz button[aria-pressed=true] { background: var(--active); color: var(--accent); border-color: var(--accent); }
  #draft-3dviz input { accent-color: var(--accent); }
  #draft-3dviz input[type=checkbox] { width: 15px; height: 15px; margin: 0; }
  #draft-3dviz input[type=range] { min-width: 0; width: 100%; margin: 0; }
  #draft-3dviz .dv-header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 22px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #draft-3dviz .dv-brand { display: flex; align-items: center; gap: 7px; font-size: 19px; letter-spacing: -.04em; white-space: nowrap; }
  #draft-3dviz .dv-brand svg { width: 19px; height: 19px; color: var(--brand); }
  #draft-3dviz .dv-source-fields { display: flex; flex-wrap: wrap; gap: 6px 13px; }
  #draft-3dviz .dv-source-fields label { display: flex; gap: 7px; align-items: center; color: var(--secondary); }
  #draft-3dviz .dv-source-fields select { color: var(--text); }
  #draft-3dviz .dv-workspace { display: grid; grid-template-columns: minmax(0, 1fr) var(--inspector-width); }
  #draft-3dviz .dv-view { position: relative; min-height: 430px; overflow: hidden; background: var(--viewport); color: #e7f0f6; }
  #draft-3dviz canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #draft-3dviz .dv-view-top, #draft-3dviz .dv-view-bottom { position: absolute; left: 14px; right: 14px; display: flex; align-items: start; justify-content: space-between; gap: 6px 12px; pointer-events: none; }
  #draft-3dviz .dv-view-top { top: 14px; }
  #draft-3dviz .dv-view-bottom { bottom: 12px; align-items: end; }
  #draft-3dviz .dv-view-caption, #draft-3dviz .dv-box-key, #draft-3dviz .dv-view-meters { padding: 5px 8px; border-radius: 4px; background: #101820; }
  #draft-3dviz .dv-view-caption { display: grid; gap: 1px; }
  #draft-3dviz .dv-view-caption span, #draft-3dviz .dv-view-meters { color: #b5c7d2; font-size: 12px; }
  #draft-3dviz .dv-camera { display: flex; gap: 4px; color: #e7f0f6; pointer-events: auto; }
  #draft-3dviz .dv-camera button { background: #18242d; border-color: #526776; }
  #draft-3dviz .dv-camera button[aria-pressed=true] { background: #c8dae6; color: #1b2c38; border-color: #c8dae6; }
  #draft-3dviz .dv-box-key { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; }
  #draft-3dviz .dv-box-key span { display: inline-flex; align-items: center; gap: 5px; }
  #draft-3dviz .dv-box-key i { width: 14px; height: 0; border-top: 2px solid var(--box-gt); }
  #draft-3dviz .dv-box-key span:nth-child(2) i { border-color: var(--box-pred); border-top-style: dashed; }
  #draft-3dviz .dv-inspector { background: var(--panel); border-left: 1px solid var(--line); }
  #draft-3dviz .dv-inspector-body, #draft-3dviz .dv-layers { padding: 12px; }
  #draft-3dviz .dv-layers { display: grid; gap: 5px; border-bottom: 1px solid var(--line); }
  #draft-3dviz .dv-layers label { display: flex; align-items: center; gap: 8px; min-height: 23px; }
  #draft-3dviz .dv-kicker { font-size: 12px; font-weight: 650; color: var(--secondary); }
  #draft-3dviz .dv-tabs { display: grid; grid-template-columns: auto 1fr auto; gap: 4px; margin-bottom: 12px; }
  #draft-3dviz .dv-tabs button { white-space: nowrap; }
  #draft-3dviz .dv-field { display: grid; gap: 5px; margin: 0 0 10px; min-width: 0; }
  #draft-3dviz .dv-field .dv-field { margin: 2px 0; }
  #draft-3dviz .dv-field > b { font-weight: 650; }
  #draft-3dviz .dv-spread { display: flex; justify-content: space-between; gap: 5px; }
  #draft-3dviz .dv-secondary { font-size: 12px; color: var(--secondary); }
  #draft-3dviz .dv-seg-source { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  #draft-3dviz .dv-class-list { display: grid; gap: 3px; }
  #draft-3dviz .dv-class-list label { display: grid; grid-template-columns: 15px 9px 1fr auto; gap: 7px; align-items: center; min-height: 23px; }
  #draft-3dviz .dv-class-list i { width: 9px; height: 9px; border-radius: 50%; background: var(--swatch); border: 1px solid var(--line); }
  #draft-3dviz .dv-count, #draft-3dviz output, #draft-3dviz .dv-frame-field { font-variant-numeric: tabular-nums; }
  #draft-3dviz [data-seg-status]:not(:empty) { margin-top: 8px; }
  #draft-3dviz .dv-timeline { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 10px 14px; padding: 10px 14px; border-top: 1px solid var(--line); }
  #draft-3dviz .dv-step { display: flex; gap: 4px; }
  #draft-3dviz .dv-step button { min-width: 32px; line-height: 1; font-size: 20px; }
  #draft-3dviz .dv-frame-field { display: flex; gap: 5px; align-items: center; white-space: nowrap; }
  #draft-3dviz .dv-frame-field input { width: 55px; }
  @media (max-width: 640px) {
    #draft-3dviz .dv-workspace { grid-template-columns: minmax(0, 1fr); }
    #draft-3dviz .dv-inspector { border-left: 0; border-top: 1px solid var(--line); }
    #draft-3dviz .dv-view { min-height: 340px; }
    #draft-3dviz .dv-tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 400px) {
    #draft-3dviz .dv-timeline input[type=range] { grid-column: 1 / -1; }
    #draft-3dviz .dv-timeline { grid-template-columns: auto minmax(0, 1fr); }
    #draft-3dviz .dv-view-meters { display: none; }
  }
  @media (pointer: coarse) {
    #draft-3dviz button, #draft-3dviz select, #draft-3dviz input[type=number], #draft-3dviz input[type=range] { min-height: 44px; }
    #draft-3dviz .dv-layers label, #draft-3dviz .dv-class-list label { min-height: 44px; }
  }
</style>

<script>
(() => {
  const root = document.getElementById('draft-3dviz');
  const get = (name) => root.querySelector(`[data-${name}]`);
  const all = (name) => [...root.querySelectorAll(`[data-${name}]`)];
  const canvas = root.querySelector('canvas');
  const context = canvas.getContext('2d');
  const classes = [
    ['Drivable surface', '#869db9'], ['Sidewalk', '#bf93de'], ['Vegetation', '#66b894'],
    ['Manmade', '#a2aeb9'], ['Car', '#f9bf63'], ['Pedestrian', '#f38fb7'],
  ];
  const definitions = {
    nuscenes: { scenes: ['Demo scene A', 'Demo scene B'], frames: 40, sensor: 'LIDAR_TOP' },
    waymo: { scenes: ['Demo segment A', 'Demo segment B'], frames: 32, sensor: 'Merged LiDAR' },
  };
  const state = { tab: 'seg', color: 'semantic', labels: 'gt', camera: 'orbit', frame: 12, heading: -.28, zoom: 1 };
  const design = { inspectorWidth: 258, pointSize: 1.5 };
  const visible = new Set(classes.map((_, index) => index));
  const palette = ['#758b9f', '#8d7679', '#7b9176', '#a19c88', '#b6a68e', '#98a4b4'];
  const undetected = '#607483';
  const distance = ['#a7b5bf', '#8496a2', '#647c8e', '#526675', '#405663'];
  const vehicleTemplate = [
    { x: -3.4, y: 9, w: 2.1, l: 4.7, h: 1.75, score: .94 },
    { x: 3.9, y: 20, w: 2, l: 4.4, h: 1.75, score: .83 },
    { x: -3.8, y: 35, w: 2.25, l: 5.2, h: 2.1, score: .56 },
    { x: 15, y: 25, w: .9, l: .9, h: 2, score: .71 },
    { x: 4.1, y: 47, w: 2.2, l: 4.8, h: 1.8, score: .28 },
  ];
  let points = [];
  let objects = [];
  const counts = [];
  let pointer = null;

  for (const [index, [name, color]] of classes.entries()) {
    const row = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = true;
    const swatch = document.createElement('i');
    swatch.style.setProperty('--swatch', color);
    swatch.setAttribute('aria-hidden', 'true');
    const label = document.createElement('span');
    label.textContent = name;
    const count = document.createElement('span');
    count.className = 'dv-secondary dv-count';
    counts.push(count);
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) visible.add(index);
      else visible.delete(index);
      draw();
    });
    row.append(checkbox, swatch, label, count);
    get('classes').append(row);
  }

  function makeScene() {
    const sceneOffset = get('scene').selectedIndex + 2 * (get('split').value === 'train');
    const waymoOffset = get('dataset').value === 'waymo' ? 3 : 0;
    let seed = 113118 + 4057 * (sceneOffset + waymoOffset);
    const random = () => {
      seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    points = [];
    const jitter = (extent) => (random() - .5) * extent;
    const point = (x, y, z, id) => points.push({ x, y, z, id, error: random() });
    for (let ring = 0; ring < 29; ring += 1) {
      const radius = 4.3 + ring * .95 + ring * ring * .045;
      for (let index = 0; index < 166; index += 1) {
        const angle = index / 166 * 2 * Math.PI + jitter(.022);
        const x = (radius + jitter(.8)) * Math.cos(angle);
        const y = (radius + jitter(.8)) * Math.sin(angle);
        if (y > 76 || y < -24 || Math.abs(x) > 40 || random() > .87) continue;
        const lateral = Math.abs(x - Math.sin(y / 28) * 1.1);
        if (lateral < 12.2) point(x, y, jitter(.16), 0);
        else if (lateral < 19) point(x, y, .16 + jitter(.18), 1);
        else point(x, y, .15 + jitter(.24), 2);
      }
    }
    for (const side of [-1, 1]) {
      for (let index = 0; index < 1450; index += 1) {
        const y = random() * 95 - 20;
        const front = Math.floor(y / 12) % 2;
        const x = side * (26 + front * 2.3 + jitter(1.8));
        const z = random() * (side === 1 ? 10 : 15);
        if (y % 12 > 9 || z < 1 && random() > .35) continue;
        point(x, y, z, 3);
      }
      for (const y of [0, 13, 30, 51, 63]) {
        const x = side * (21 + jitter(2));
        for (let index = 0; index < 125; index += 1) {
          const height = 2 + random() * 4.8;
          point(x + jitter(4), y + jitter(5), height, 2);
        }
      }
    }
    objects = vehicleTemplate.map((object, index) => ({ ...object, y: object.y + (state.frame - 12) * (index % 2 ? -.11 : .32) + sceneOffset * .9 }));
    for (const [index, object] of objects.entries()) {
      for (let row = 0; row < (index === 3 ? 32 : 110); row += 1) {
        const x = object.x + (row % 2 ? jitter(object.w) : object.w / 2 * (row % 4 ? -1 : 1));
        point(x, object.y + jitter(object.l), .27 + random() * object.h * .8, index === 3 ? 5 : 4);
      }
    }
  }

  const errorRate = () => get('run').value === 'a' ? .18 : .08;

  function predictedClass(point, rate) {
    if (point.error >= rate) return point.id;
    return [1, 0, 3, 2, 3, 1][point.id];
  }

  const canLabel = () => get('dataset').value === 'nuscenes';
  const noPrediction = () => state.labels === 'pred' && state.frame % 13 === 0;
  const threshold = () => Number(get('confidence').value);

  function draw() {
    const { width, height } = canvas.getBoundingClientRect();
    if (!context || !width || !height) return;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    const pixelWidth = Math.round(width * ratio);
    const pixelHeight = Math.round(height * ratio);
    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.clearRect(0, 0, width, height);
    const glow = context.createRadialGradient(width * .53, height * .52, 6, width * .53, height * .52, Math.max(width, height) * .62);
    glow.addColorStop(0, '#1c2a36');
    glow.addColorStop(1, '#101820');
    context.fillStyle = glow;
    context.fillRect(0, 0, width, height);

    const top = state.camera === 'top';
    const heading = top ? 0 : state.heading;
    const sine = Math.sin(heading);
    const cosine = Math.cos(heading);
    const scale = Math.min(width / (top ? 76 : 72), height / (top ? 93 : 49)) * state.zoom;
    function project(x, y, z) {
      const offsetY = y - (top ? 20 : 8);
      const right = x * cosine + offsetY * sine;
      const forward = -x * sine + offsetY * cosine;
      const perspective = top ? 1 : 72 / Math.max(25, 72 + forward * .67 - z * .67);
      return [width * .51 + right * scale * perspective, height * (top ? .50 : .65) - (top ? forward : forward * .66 + z * .75) * scale * perspective];
    }

    function line(a, b) {
      context.beginPath();
      context.moveTo(...project(...a));
      context.lineTo(...project(...b));
      context.stroke();
    }

    context.strokeStyle = '#2a3a46';
    context.lineWidth = .65;
    for (let x = -80; x <= 80; x += 10) line([x, -28, 0], [x, 120, 0]);
    for (let y = -20; y <= 110; y += 10) line([-80, y, 0], [80, y, 0]);
    context.strokeStyle = '#4a5964';
    line([-80, 0, .02], [80, 0, .02]);
    line([0, -24, .02], [0, 110, .02]);

    if (get('cloud').checked) {
      const semantic = state.color === 'semantic' && canLabel();
      const available = semantic && !noPrediction();
      const usePredictions = available && state.labels === 'pred';
      const rate = errorRate();
      const size = Number(get('size').value);
      context.globalAlpha = .78;
      for (const point of points) {
        const id = usePredictions ? predictedClass(point, rate) : point.id;
        if (available && !visible.has(id)) continue;
        const [x, y] = project(point.x, point.y, point.z);
        if (x < 0 || x > width || y < 0 || y > height) continue;
        if (available) context.fillStyle = classes[id][1];
        else if (semantic) context.fillStyle = undetected;
        else if (state.color === 'rgb') context.fillStyle = palette[point.id];
        else context.fillStyle = distance[Math.min(4, Math.floor(Math.hypot(point.x, point.y) / 17))];
        const diameter = size * (id >= 4 ? 1.3 : .83);
        context.fillRect(x, y, diameter, diameter);
      }
      context.globalAlpha = 1;
    }

    function box(obj, predicted) {
      const { x, y, w, l, h } = obj;
      const positionX = predicted ? x + .31 : x;
      const positionY = predicted ? y + .44 : y;
      const halfW = w / 2 + (predicted ? .13 : 0);
      const halfL = l / 2 + (predicted ? .12 : 0);
      const corners = [[-halfW, -halfL], [halfW, -halfL], [halfW, halfL], [-halfW, halfL]];
      const floor = corners.map(([dx, dy]) => [positionX + dx, positionY + dy, .16]);
      const roof = floor.map(([px, py]) => [px, py, h + (predicted ? .15 : 0)]);
      context.strokeStyle = predicted ? '#ffb26d' : '#97e9c3';
      context.lineWidth = predicted ? 1.45 : 1.25;
      context.setLineDash(predicted ? [4, 3] : []);
      for (let index = 0; index < 4; index += 1) {
        const next = (index + 1) % 4;
        line(floor[index], floor[next]);
        if (!top) {
          line(roof[index], roof[next]);
          line(floor[index], roof[index]);
        }
      }
      context.setLineDash([]);
    }

    for (const obj of objects) {
      if (get('gt-boxes').checked) box(obj, false);
      if (get('pred-boxes').checked && obj.score >= threshold()) box(obj, true);
    }
    const [egoX, egoY] = project(0, 0, .12);
    context.strokeStyle = '#dce8ef';
    context.lineWidth = 1;
    context.beginPath();
    context.moveTo(egoX - 4, egoY); context.lineTo(egoX + 4, egoY);
    context.moveTo(egoX, egoY - 4); context.lineTo(egoX, egoY + 4);
    context.stroke();
  }

  function setSceneOptions() {
    const definition = definitions[get('dataset').value];
    get('scene').replaceChildren(...definition.scenes.map((name, index) => new Option(name, String(index))));
    get('frame').max = definition.frames;
    get('frame-jump').max = definition.frames;
    get('total').textContent = `/ ${definition.frames}`;
    get('sensor').textContent = definition.sensor;
    get('color').querySelector('[value=semantic]').disabled = !canLabel();
  }

  function bindSelection(name, value) {
    for (const control of all(name)) control.setAttribute('aria-pressed', String(control.dataset[name] === value));
  }

  function refresh({ geometry = false } = {}) {
    if (geometry) makeScene();
    get('frame').value = state.frame;
    get('frame-jump').value = state.frame;
    all('step')[0].disabled = state.frame === 1;
    all('step')[1].disabled = state.frame === Number(get('frame').max);
    get('color').value = state.color;
    get('run-field').hidden = state.labels !== 'pred';
    get('gt-key').hidden = !get('gt-boxes').checked;
    get('pred-key').hidden = !get('pred-boxes').checked;
    get('seg-controls').hidden = !canLabel();
    get('classes').hidden = !canLabel() || state.color !== 'semantic' || noPrediction();
    get('seg-status').textContent = !canLabel() ? 'Semantic labels are unavailable for this source.'
      : state.color !== 'semantic' ? 'Select a label source to color points by class.'
      : noPrediction() ? 'This run has no labels for the current frame.' : '';
    get('camera-label').textContent = state.camera === 'top' ? 'Top view · m' : 'LiDAR reference · m';
    get('confidence-value').textContent = threshold().toFixed(2);
    const count = objects.filter((obj) => obj.score >= threshold()).length;
    get('detection-status').textContent = `${objects.length} imported · ${count} pass confidence`;
    bindSelection('tab', state.tab);
    bindSelection('camera', state.camera);
    bindSelection('labels', state.labels);
    for (const panel of all('panel')) panel.hidden = panel.dataset.panel !== state.tab;
    if (canLabel() && !noPrediction()) {
      const totals = classes.map(() => 0);
      const rate = errorRate();
      for (const point of points) totals[state.labels === 'pred' ? predictedClass(point, rate) : point.id] += 1;
      counts.forEach((element, index) => { element.textContent = totals[index].toLocaleString('en-US'); });
    }
    draw();
  }

  function setFrame(number) {
    state.frame = Math.max(1, Math.min(Number(get('frame').max), Math.trunc(number)));
    refresh({ geometry: true });
  }

  for (const button of all('tab')) button.addEventListener('click', () => {
    state.tab = button.dataset.tab;
    refresh();
  });
  for (const button of all('camera')) button.addEventListener('click', () => {
    state.camera = button.dataset.camera;
    refresh();
  });
  for (const button of all('labels')) button.addEventListener('click', () => {
    state.labels = button.dataset.labels;
    state.color = 'semantic';
    refresh();
  });
  for (const button of all('step')) button.addEventListener('click', () => setFrame(state.frame + Number(button.dataset.step)));
  get('dataset').addEventListener('change', () => {
    setSceneOptions();
    if (!canLabel() && state.color === 'semantic') state.color = 'distance';
    setFrame(1);
  });
  get('split').addEventListener('change', () => { setSceneOptions(); setFrame(1); });
  get('scene').addEventListener('change', () => setFrame(1));
  get('frame').addEventListener('input', (event) => setFrame(event.target.valueAsNumber));
  get('frame-jump').addEventListener('change', (event) => {
    setFrame(Number.isFinite(event.target.valueAsNumber) ? event.target.valueAsNumber : state.frame);
  });
  get('color').addEventListener('change', (event) => { state.color = event.target.value; refresh(); });
  get('reset').addEventListener('click', () => {
    Object.assign(state, { camera: 'orbit', heading: -.28, zoom: 1 });
    refresh();
  });
  for (const name of ['run', 'cloud', 'gt-boxes', 'pred-boxes', 'confidence']) get(name).addEventListener('input', () => refresh());
  get('size').addEventListener('input', () => draw());
  canvas.addEventListener('pointerdown', (event) => {
    if (state.camera !== 'orbit' || event.button !== 0) return;
    pointer = event.clientX;
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove', (event) => {
    if (pointer === null) return;
    state.heading += (event.clientX - pointer) * .009;
    pointer = event.clientX;
    draw();
  });
  canvas.addEventListener('lostpointercapture', () => { pointer = null; });
  canvas.addEventListener('wheel', (event) => {
    if (!event.altKey) return;
    event.preventDefault();
    state.zoom = Math.max(.55, Math.min(2.4, state.zoom * Math.exp(-event.deltaY / 500)));
    draw();
  }, { passive: false });

  setSceneOptions();
  refresh({ geometry: true });
  new ResizeObserver(draw).observe(canvas);
  if (globalThis.Tweak) {
    const inspector = root.querySelector('.dv-inspector');
    const tweak = new Tweak({ container: inspector, onChange: () => {
      root.style.setProperty('--inspector-width', `${design.inspectorWidth}px`);
      get('size').value = design.pointSize;
      draw();
    } });
    tweak.addSlider(design, 'inspectorWidth', { label: 'Inspector width', min: 250, max: 310, unit: 'px' });
    tweak.addSlider(design, 'pointSize', { label: 'Point diameter', min: 1, max: 3, step: .25, unit: 'px' });
  }
})();
</script>
