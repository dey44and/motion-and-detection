[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threedviz"
version = "0.3.0"
description = "Local browser viewer for point clouds, cameras, 3D detections, and LiDAR segmentation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "visual-utils>=0.3,<0.4",
    "numpy>=1.24,<3",
    "Pillow>=10,<13",
    "matplotlib>=3.6,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "ijson>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "httpx>=0.27,<1"]
web = []

[project.scripts]
3dviz = "threedviz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"threedviz.web" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
