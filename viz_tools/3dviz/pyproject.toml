[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threedviz"
version = "0.3.0"
description = "Desktop and local browser point cloud viewer for autonomous driving datasets"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "visual-utils>=0.3,<0.4",
    "numpy>=1.24,<3",
    "matplotlib>=3.6,<4",
    "open3d>=0.19,<0.20",
    "glfw>=2.7,<3",
    # Open3D imports pandas; older pandas wheels are incompatible with NumPy 2.
    "pandas>=2.2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "httpx>=0.27,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
3dviz = "threedviz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"threedviz.web" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
