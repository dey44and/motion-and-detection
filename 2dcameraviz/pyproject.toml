[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cameraviz"
version = "0.1.0"
description = "Standalone six-camera viewer for autonomous driving datasets and projected 3D boxes"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<3",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
2dcameraviz = "cameraviz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["desktop: requires an available Tk desktop display"]
